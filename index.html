<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern CSS Buttons</title>
    <style>
        /* Base setup to center things nicely on the page */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Sleek dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: screen;
            height: 100vh;
            gap: 20px;
            margin: 0;
        }

        /* 1. THE SOLID PRIMARY BUTTON */
        .btn-primary {
            background-color: #4f46e5; font-weight: 600; color: white;
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; text-decoration: none; font-size: 16px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: all 0.2s ease; /* Smooth animation timing */
        }
        /* Hover effect: darkens background and lifts slightly */
        .btn-primary:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        /* 2. THE OUTLINE SECONDARY BUTTON */
        .btn-outline {
            background-color: transparent; font-weight: 600; color: #94a3b8;
            padding: 12px 24px; border: 2px solid #334155; border-radius: 8px;
            cursor: pointer; text-decoration: none; font-size: 16px;
            transition: all 0.2s ease;
        }
        /* Hover effect: changes borders and lights up text */
        .btn-outline:hover {
            border-color: #64748b;
            color: #f8fafc;
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* 3. THE SQUISHY GLOW BUTTON (High-end Startup Look) */
        .btn-glow {
            background: linear-gradient(135deg, #ec4899, #8b5cf6); font-weight: 600; color: white;
            padding: 12px 28px; border: none; border-radius: 50px; /* Pill shape */
            cursor: pointer; text-decoration: none; font-size: 16px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover {
            transform: scale(1.03); /* Zooms in slightly */
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.6);
        }
        /* Active effect: squishes down when physically clicked */
        .btn-glow:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Three different buttons styled entirely with the CSS classes above -->
    <a href="#" class="btn-primary">Get Started</a>
    <a href="#" class="btn-outline">Learn More</a>
    <button class="btn-glow">Launch App</button>

</body>
</html>
